<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The ultimate keyboard shortcuts reference — 15 apps across macOS, Windows, ChromeOS, Adobe CC, Microsoft Office, Vim, VS Code, Blender, and more.">
  <meta name="theme-color" content="#0d1117">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Keyboard Shortcuts Reference</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230d1117'/><text x='8' y='12.5' text-anchor='middle' font-size='11' fill='%2358a6ff'>⌨</text></svg>">

  <!-- Preload fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <a href="#" class="header-logo" aria-label="Keyboard Shortcuts Reference - Home">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="5" width="22" height="13" rx="3" stroke="currentColor" stroke-width="1.5"/>
        <rect x="3.5" y="7.5" width="3.5" height="3.5" rx="1" fill="currentColor" opacity="0.15"/>
        <rect x="8.5" y="7.5" width="3.5" height="3.5" rx="1" fill="currentColor" opacity="0.15"/>
        <rect x="13.5" y="7.5" width="3.5" height="3.5" rx="1" fill="currentColor" opacity="0.15"/>
        <rect x="3.5" y="12" width="3.5" height="3.5" rx="1" fill="currentColor" opacity="0.25"/>
        <rect x="8.5" y="12" width="3.5" height="3.5" rx="1" fill="currentColor" opacity="0.25"/>
        <rect x="13.5" y="12" width="7" height="3.5" rx="1" fill="currentColor" opacity="0.25"/>
      </svg>
      Hotkeys
    </a>

    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
        </svg>
      </button>
      <a href="https://github.com/WeirdG/hotkeys" class="theme-toggle" target="_blank" rel="noopener" aria-label="View on GitHub" style="display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 16 16" fill="currentColor" style="width:18px;height:18px;">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
    </div>
  </header>

  <!-- Category Navigation -->
  <div class="main">
    <nav class="category-nav" id="categoryNav" aria-label="Category filters"></nav>

    <!-- Product Tabs -->
    <div class="product-tabs-wrapper" id="productTabsWrapper">
      <div class="product-tabs" id="productTabs" role="tablist" aria-label="Product tabs"></div>
    </div>

    <!-- Search -->
    <div class="search-bar" id="searchBar">
      <div class="search-input-wrapper">
        <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
        </svg>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search shortcuts... (press / to focus)"
          autocomplete="off"
          spellcheck="false"
        >
        <button class="search-clear hidden" id="searchClear" aria-label="Clear search">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
          </svg>
        </button>
      </div>
      <div class="search-info">
        <span id="searchResultCount"></span>
        <button class="search-all-toggle" id="searchAllToggle" style="display:none;">Search all products</button>
      </div>
    </div>

    <!-- Shortcut Content -->
    <div class="shortcuts-content" id="shortcutsContent" role="tabpanel"></div>

    <!-- Footer -->
    <footer class="footer">
      <p>Keyboard shortcuts reference. Open source on <a href="https://github.com/WeirdG/hotkeys" target="_blank" rel="noopener">GitHub</a>. Press <kbd class="mod">/</kbd> to search, arrow keys to navigate tabs.</p>
    </footer>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/app.js?v=4"></script>
</body>
</html>
